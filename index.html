    <script>
      (function() {
        // Immediate handler to capture and drop external browser extension inpage errors
        window.addEventListener('error', function(e) {
          var msg = (e && e.message) ? String(e.message) : '';
          var src = (e && e.filename) ? String(e.filename) : '';
          if (
            msg.indexOf('MetaMask') !== -1 ||
            msg.indexOf('Failed to connect') !== -1 ||
            src.indexOf('chrome-extension://') !== -1 ||
            src.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1
          ) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.stopPropagation) e.stopPropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && e.reason) ? String(e.reason && e.reason.message ? e.reason.message : e.reason) : '';
          if (
            reason.indexOf('MetaMask') !== -1 ||
            reason.indexOf('Failed to connect') !== -1 ||
            reason.indexOf('chrome-extension://') !== -1
          ) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.stopPropagation) e.stopPropagation();
            if (e.preventDefault) e.preventDefault();
          }
        }, true);
      })();
    </script>
